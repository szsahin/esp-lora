; NEO-6M GPS testi — NodeMCU v3 (ESP8266), düğüm B (verici)
; Bağlantı: GPS VCC -> 3V3 (5V/Vin KULLANMA), GND -> GND, GPS TX -> D1 (GPIO5), GPS RX bağlı değil
;
;   pio run -e node_b -t upload
;   pio device monitor -e node_b
; Windows / farklı port: --upload-port COM5 / -p COM5

[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps = mikalhart/TinyGPSPlus@1.1.0

[env:node_b]
build_flags = -D NODE_ID=B
upload_port = /dev/serial/by-path/pci-0000:00:1a.0-usb-0:1.1:1.0-port0
monitor_port = /dev/serial/by-path/pci-0000:00:1a.0-usb-0:1.1:1.0-port0
