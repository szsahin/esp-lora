; Ra-02 (SX1278) donanım testi — NodeMCU v3 (ESP8266)
; Pinout: wiki "Donanım" sayfası (NSS D8, DIO0 D2, RST D0, SPI D5/D6/D7)
;
;   pio run -e node_a -t upload     (A: verici, paket gönderir)
;   pio run -e node_b -t upload     (B: alıcı, RSSI/SNR yazar)
;   pio device monitor -e node_a

[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps = jgromes/RadioLib@7.8.1

[env:node_a]
build_flags = -D NODE_ID='"A"' -D ROLE_TX=1
upload_port = /dev/serial/by-path/pci-0000:0b:00.0-usb-0:2:1.0-port0
monitor_port = /dev/serial/by-path/pci-0000:0b:00.0-usb-0:2:1.0-port0

[env:node_b]
build_flags = -D NODE_ID='"B"' -D ROLE_TX=0
upload_port = /dev/serial/by-path/pci-0000:00:1a.0-usb-0:1.1:1.0-port0
monitor_port = /dev/serial/by-path/pci-0000:00:1a.0-usb-0:1.1:1.0-port0
