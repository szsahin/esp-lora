; GPS + LoRa — B (verici, NEO-6M) konumu her 5 sn'de A'ya (alıcı) gönderir
; B bağlantısı: GPS VCC -> 3V3 (5V/Vin KULLANMA), GND -> GND, GPS TX -> D1 (GPIO5), GPS RX boş
; Ra-02 pinleri: wiki "Donanım" (NSS D8, DIO0 D2, RST D0, SPI D5/D6/D7)
;
;   pio run -e node_b -t upload     (B: VERICI + GPS)
;   pio run -e node_a -t upload     (A: ALICI)
;   İzleme (A): gps-izle   (= tools/gps_monitor.py)
; Windows / farklı port: --upload-port COM5

[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    jgromes/RadioLib@7.8.1
    mikalhart/TinyGPSPlus@1.1.0

[env:node_a]
build_flags = -D NODE_ID=A -D ROLE_TX=0
upload_port = /dev/serial/by-path/pci-0000:0b:00.0-usb-0:2:1.0-port0
monitor_port = /dev/serial/by-path/pci-0000:0b:00.0-usb-0:2:1.0-port0

[env:node_b]
build_flags = -D NODE_ID=B -D ROLE_TX=1
upload_port = /dev/serial/by-path/pci-0000:00:1a.0-usb-0:1.1:1.0-port0
monitor_port = /dev/serial/by-path/pci-0000:00:1a.0-usb-0:1.1:1.0-port0
