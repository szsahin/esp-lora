<text x="540.0" y="38" font-size="20" text-anchor="middle" font-weight="bold" fill="#222" >NodeMCU v3 (ESP8266)  ↔  Ai-Thinker Ra-02 (SX1278, 433 MHz)</text>
<text x="540.0" y="62" font-size="12" text-anchor="middle" font-weight="normal" fill="#666" >esp-lora · A = alıcı, B = verici · Ra-02 bağlantısı iki düğümde aynı, GPS yalnızca B'de · mantıksal çizim (Ra-02 fiziksel pad sırası için pin numaralarına bakın)</text>
