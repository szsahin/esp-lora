<text x="646" y="164" font-size="10.5" text-anchor="end" font-weight="bold" fill="#6d4c41" >GPS TX → D1</text>
<text x="646" y="184" font-size="10" text-anchor="end" font-weight="normal" fill="#6d4c41" >(SoftwareSerial)</text>
<text x="430" y="622" font-size="12" text-anchor="start" font-weight="normal" fill="#c62828" >⚠ Ra-02 yalnızca 3.3 V ile çalışır — 5V / Vin'e bağlamayın.</text>
<text x="430" y="642" font-size="12" text-anchor="start" font-weight="normal" fill="#c62828" >⚠ 433 MHz anten takılmadan yayın yapmayın (PA zarar görebilir).</text>
<text x="430" y="662" font-size="12" text-anchor="start" font-weight="normal" fill="#c62828" >⚠ GPS 3.3 V ile beslenir (3V3, Ra-02 ile ortak) — Vin/5V kullanmayın.</text>
<text x="430" y="682" font-size="12" text-anchor="start" font-weight="normal" fill="#c62828" >⚠ GPS TX'i RX (GPIO3) pinine bağlamayın — USB-seri (CH340) ile çakışır.</text>
<text x="430" y="702" font-size="12" text-anchor="start" font-weight="normal" fill="#333" >• D4 (GPIO2): kart üstü LED, düğüm tanıma (açılışta A tek, B çift yanıp söner).</text>
<text x="430" y="722" font-size="12" text-anchor="start" font-weight="normal" fill="#333" >• D3 (GPIO0) boot pini, boş. RST bilinçli olarak D0'da.</text>
<text x="430" y="742" font-size="12" text-anchor="start" font-weight="normal" fill="#333" >• RadioLib:  SX1278 radio = new Module(15, 4, 16, RADIOLIB_NC);</text>
</svg>
